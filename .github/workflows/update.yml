name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape official pricing pages
        run: python scraper.py

      - name: Alert on parser health drops
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci_alert.py

      - name: Rebuild static site
        run: python build.py

      - name: Commit refreshed data and site
        run: |
          git config user.name "promo-radar bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(data): refresh offers $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
