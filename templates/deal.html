<div class="crumbs">$breadcrumb</div>
<div class="hero" style="padding-top:8px">
  <div>
    <div class="eyebrow">Verified offer record</div>
    <h1>$deal_title</h1>
    <p class="lede">$deal_lede</p>
  </div>
  <div class="card">
    <div class="price">$price_display</div>
    <div class="sub">$status_line</div>
    <a class="cta" href="$offer_url" rel="nofollow noopener" target="_blank">View official page ↗</a>
  </div>
</div>

<h2>Offer record</h2>
<table>
<tbody>
<tr><th style="width:180px">Provider</th><td><a href="$provider_url">$provider_name</a></td></tr>
<tr><th>Plan</th><td>$plan</td></tr>
<tr><th>Price</th><td>$price_line</td></tr>
<tr><th>Valid until</th><td>$valid_until</td></tr>
<tr><th>Source page</th><td><a href="$source_url" rel="nofollow noopener" target="_blank">$source_url</a></td></tr>
<tr><th>Fetched at</th><td>$fetched_at</td></tr>
</tbody>
</table>
<p class="note" style="margin-top:16px">$note</p>
